<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pomodoro</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome para ícones táticos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Fontes Inter & JetBrains Mono para precisão e legibilidade -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tactical: {
                            950: '#0b0e14',
                            900: '#121722',
                            800: '#1b2234',
                            700: '#2a344d',
                            600: '#3d4b6e',
                            amber: '#f59e0b',
                            amberDark: '#d97706',
                            emerald: '#10b981',
                            cyan: '#06b6d4'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0e14;
            color: #e2e8f0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Efeito de anel de progresso circular tático */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.4s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Custom Scrollbar minimalista */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #121722;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a344d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3d4b6e;
        }

        /* Animação suave para brilho sutil */
        .glow-amber {
            box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.25);
        }
        .glow-emerald {
            box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.25);
        }
        .glow-cyan {
            box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-3 sm:p-6 transition-colors duration-500">

    <!-- CABEÇALHO TÁTICO -->
    <header class="w-full max-w-lg flex justify-between items-center py-3 px-4 bg-tactical-900/90 border border-tactical-700/50 rounded-2xl backdrop-blur-md shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-tactical-amber to-amber-700 flex items-center justify-center text-tactical-950 font-black text-lg shadow-md">
                <i class="fa-solid fa-crosshairs"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-base tracking-wider uppercase text-slate-100 font-mono">POMODORO</h1>
                <p class="text-[11px] text-slate-400 font-medium">GERENCIADOR DE FOCO</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <button id="btnStats" onclick="toggleStatsModal()" class="w-10 h-10 bg-tactical-800 hover:bg-tactical-700 text-slate-300 hover:text-white rounded-xl border border-tactical-700/60 transition-all flex items-center justify-center active:scale-95" title="Estatísticas">
                <i class="fa-solid fa-chart-simple text-sm"></i>
            </button>
            <button id="btnSettings" onclick="openSettings()" class="w-10 h-10 bg-tactical-800 hover:bg-tactical-700 text-slate-300 hover:text-white rounded-xl border border-tactical-700/60 transition-all flex items-center justify-center active:scale-95" title="Configurações">
                <i class="fa-solid fa-sliders text-sm"></i>
            </button>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL DO TIMER -->
    <main class="w-full max-w-lg flex flex-col items-center my-auto py-4 space-y-5">
        
        <!-- Seleção de Modo Tático -->
        <div class="bg-tactical-900/90 p-1.5 rounded-2xl flex gap-1.5 w-full border border-tactical-700/50 shadow-inner">
            <button id="modeFocus" onclick="switchMode('focus')" class="flex-1 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider transition-all duration-300 bg-tactical-amber text-tactical-950 shadow-md flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-bolt text-xs"></i> Foco Profundo
            </button>
            <button id="modeShort" onclick="switchMode('shortBreak')" class="flex-1 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider transition-all duration-300 text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-shield-halved text-xs"></i> Pausa Curta
            </button>
            <button id="modeLong" onclick="switchMode('longBreak')" class="flex-1 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider transition-all duration-300 text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-battery-charging text-xs"></i> Recarga Longa
            </button>
        </div>

        <!-- DISPLAY CIRCULAR DO CRONÔMETRO -->
        <div id="timerCard" class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center bg-tactical-900/40 rounded-full border border-tactical-700/30 p-2 shadow-2xl transition-all duration-500 glow-amber">
            <svg class="w-full h-full transform" viewBox="0 0 100 100">
                <!-- Círculo guia -->
                <circle class="text-tactical-800/80" stroke-width="5" stroke="currentColor" fill="transparent" r="42" cx="50" cy="50" />
                <!-- Círculo de progresso preenchido -->
                <circle id="progressRing" class="progress-ring__circle text-tactical-amber" stroke-width="5" stroke-linecap="round" stroke="currentColor" fill="transparent" r="42" cx="50" cy="50" stroke-dasharray="263.89" stroke-dashoffset="0" />
            </svg>

            <!-- Display Central com dígitos digitais estilo painel tático -->
            <div class="absolute flex flex-col items-center text-center">
                <span id="timerDisplay" class="text-5xl sm:text-6xl font-extrabold tracking-tighter font-mono text-slate-100 drop-shadow-md">25:00</span>
                <div class="flex items-center gap-1.5 mt-2 px-3 py-1 rounded-full bg-tactical-800/80 border border-tactical-700/60">
                    <span id="statusDot" class="w-2 h-2 rounded-full bg-tactical-amber animate-pulse"></span>
                    <span id="statusLabel" class="text-[10px] uppercase font-bold tracking-widest text-slate-300">FOCO TOTAL ATIVO</span>
                </div>
            </div>
        </div>

        <!-- PAINEL DE CONTROLE PRINCIPAL (BOTOES) -->
        <div class="flex items-center gap-3 w-full justify-center">
            <button id="btnReset" onclick="resetTimer()" class="w-14 h-14 bg-tactical-900 hover:bg-tactical-800 text-slate-400 hover:text-slate-100 rounded-2xl border border-tactical-700/60 transition-all active:scale-95 flex items-center justify-center shadow-lg" title="Reiniciar Sessão">
                <i class="fa-solid fa-rotate-right text-base"></i>
            </button>

            <button id="btnStart" onclick="toggleTimer()" class="flex-1 py-4 bg-tactical-amber hover:bg-amber-500 text-tactical-950 font-black rounded-2xl shadow-xl text-base tracking-wider uppercase transition-all active:scale-95 flex items-center justify-center gap-2">
                <i id="startIcon" class="fa-solid fa-play"></i> <span id="startText">INICIAR MISSÃO</span>
            </button>

            <button id="btnSkip" onclick="skipSession()" class="w-14 h-14 bg-tactical-900 hover:bg-tactical-800 text-slate-400 hover:text-slate-100 rounded-2xl border border-tactical-700/60 transition-all active:scale-95 flex items-center justify-center shadow-lg" title="Pular Etapa">
                <i class="fa-solid fa-forward-step text-base"></i>
            </button>
        </div>

        <!-- CONTROLADOR DE RUÍDO & AUDIO DE FOCO (Sintetizado via Web Audio API) -->
        <div class="w-full bg-tactical-900/80 p-3.5 rounded-2xl border border-tactical-700/50 shadow-md flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
                <div id="ambientIconBg" class="w-8 h-8 rounded-lg bg-tactical-800 flex items-center justify-center text-slate-400">
                    <i class="fa-solid fa-headphones text-xs"></i>
                </div>
                <div>
                    <div class="text-xs font-bold text-slate-200">Sons</div>
                    <div id="ambientSoundName" class="text-[10px] text-slate-400">Ruído Marrom (Foco Profundo)</div>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <select id="soundTypeSelect" onchange="changeSoundType()" class="bg-tactical-800 text-slate-200 text-xs border border-tactical-700 rounded-xl px-2 py-1.5 focus:outline-none">
                    <option value="brown">Ruído Marrom</option>
                    <option value="rain">Chuva Suave</option>
                </select>
                <button id="btnAmbient" onclick="toggleAmbientSound()" class="px-3 py-1.5 bg-tactical-800 hover:bg-tactical-700 border border-tactical-700 rounded-xl text-xs font-bold text-slate-200 transition-all flex items-center gap-1.5 active:scale-95">
                    <i id="ambientIcon" class="fa-solid fa-play text-[10px]"></i> <span id="ambientStateText">Ligar</span>
                </button>
            </div>
        </div>

    </main>

    <!-- GERENCIADOR DE MISSÕES E OBJETIVOS DA SESSÃO -->
    <section class="w-full max-w-lg bg-tactical-900/90 p-4 rounded-2xl border border-tactical-700/50 shadow-xl mb-3 space-y-3">
        
        <div class="flex items-center justify-between pb-2 border-b border-tactical-800">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-list-check text-tactical-amber text-sm"></i>
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-200">Objetivos</h2>
            </div>
            <div class="flex items-center gap-1 text-xs font-mono font-bold text-slate-400">
                <span>CONCLUÍDAS:</span>
                <span id="taskCompletedRatio" class="text-tactical-amber">0/0</span>
            </div>
        </div>

        <!-- Formulário de Inserção de Tarefa -->
        <form id="taskForm" onsubmit="addTask(event)" class="flex gap-2">
            <input type="text" id="taskInput" placeholder="Ex: Analisar relatório, Ler 20 paginas..." class="flex-1 bg-tactical-950 border border-tactical-700 rounded-xl px-3 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-tactical-amber transition-all" required>
            
            <select id="taskPriority" class="bg-tactical-950 border border-tactical-700 rounded-xl px-2 py-2 text-xs text-slate-300 focus:outline-none">
                <option value="Alta">🔴 Alta</option>
                <option value="Média" selected>🟡 Média</option>
                <option value="Baixa">🟢 Baixa</option>
            </select>

            <button type="submit" class="bg-tactical-amber hover:bg-amber-500 text-tactical-950 font-bold px-3.5 py-2 rounded-xl text-xs transition-all active:scale-95">
                <i class="fa-solid fa-plus"></i>
            </button>
        </form>

        <!-- Lista de Objetivos -->
        <ul id="taskList" class="space-y-2 max-h-40 overflow-y-auto pr-1">
            <!-- Inserido dinamicamente via JS -->
        </ul>
    </section>

    <!-- MODAL DE ESTATÍSTICAS -->
    <div id="statsModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        <div class="bg-tactical-900 border border-tactical-700 rounded-3xl w-full max-w-sm p-5 shadow-2xl transform scale-95 transition-transform duration-300" id="statsModalBox">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-extrabold text-sm uppercase tracking-wider text-white flex items-center gap-2 font-mono">
                    <i class="fa-solid fa-chart-line text-tactical-amber"></i> Desempenho Operacional
                </h3>
                <button onclick="toggleStatsModal()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="bg-tactical-950 p-3 rounded-2xl border border-tactical-800 text-center">
                    <div class="text-[10px] uppercase font-semibold text-slate-400">Pomodoros Hoje</div>
                    <div id="statTodayCount" class="text-2xl font-black font-mono text-tactical-amber mt-1">0</div>
                </div>
                <div class="bg-tactical-950 p-3 rounded-2xl border border-tactical-800 text-center">
                    <div class="text-[10px] uppercase font-semibold text-slate-400">Horas de Foco</div>
                    <div id="statTotalHours" class="text-2xl font-black font-mono text-slate-100 mt-1">0.0h</div>
                </div>
            </div>

            <div class="bg-tactical-950 p-3 rounded-2xl border border-tactical-800 mb-4">
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-slate-400">Meta Diária (4 Pomodoros)</span>
                    <span id="statGoalPercent" class="font-bold text-tactical-amber">0%</span>
                </div>
                <div class="w-full bg-tactical-800 rounded-full h-2 overflow-hidden">
                    <div id="statGoalBar" class="bg-tactical-amber h-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <button onclick="toggleStatsModal()" class="w-full py-2.5 bg-tactical-800 hover:bg-tactical-700 text-slate-200 rounded-xl text-xs font-bold transition-all">
                Fechar Painel
            </button>
        </div>
    </div>

    <!-- MODAL DE CONFIGURAÇÕES -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        <div class="bg-tactical-900 border border-tactical-700 rounded-3xl w-full max-w-sm p-5 shadow-2xl transform scale-95 transition-transform duration-300" id="settingsModalBox">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-extrabold text-sm uppercase tracking-wider text-white flex items-center gap-2 font-mono">
                    <i class="fa-solid fa-sliders text-tactical-amber"></i> Ajustes de Sessão
                </h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-3.5">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Foco Profundo (minutos)</label>
                    <input type="number" id="inputFocus" min="1" max="90" value="25" class="w-full bg-tactical-950 border border-tactical-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-tactical-amber font-mono">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Pausa Curta (minutos)</label>
                    <input type="number" id="inputShort" min="1" max="30" value="5" class="w-full bg-tactical-950 border border-tactical-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-tactical-amber font-mono">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Recarga Longa (minutos)</label>
                    <input type="number" id="inputLong" min="1" max="60" value="15" class="w-full bg-tactical-950 border border-tactical-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-tactical-amber font-mono">
                </div>
                <div class="pt-2 border-t border-tactical-800 flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-300">Vibração Hática no Celular</span>
                    <input type="checkbox" id="inputHaptics" checked class="accent-tactical-amber w-4 h-4 rounded">
                </div>
            </div>

            <div class="mt-5 flex justify-end gap-2">
                <button onclick="closeSettings()" class="px-3.5 py-2 bg-tactical-800 text-slate-300 rounded-xl text-xs font-bold hover:bg-tactical-700 transition-all">Cancelar</button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-tactical-amber text-tactical-950 rounded-xl text-xs font-extrabold hover:bg-amber-500 transition-all shadow-md">Salvar Ajustes</button>
            </div>
        </div>
    </div>

    <!-- NOTIFICAÇÃO TOAST CUSTOMIZADA -->
    <div id="toast" class="fixed bottom-6 bg-tactical-900 border border-tactical-700 text-slate-100 px-4 py-3 rounded-2xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 z-50">
        <i class="fa-solid fa-circle-check text-tactical-amber text-lg" id="toastIcon"></i>
        <span id="toastMsg" class="text-xs font-bold">Notificação</span>
    </div>

    <!-- MOTOR EM JAVASCRIPT -->
    <script>
        // CONFIGURAÇÕES PADRÃO DE TEMPO (em segundos)
        let config = {
            focus: 25 * 60,
            shortBreak: 5 * 60,
            longBreak: 15 * 60,
            enableHaptics: true
        };

        // ESTADO GLOBAL DA APLICAÇÃO
        let currentMode = 'focus'; // 'focus', 'shortBreak', 'longBreak'
        let timeLeft = config.focus;
        let totalTime = config.focus;
        let timerInterval = null;
        let isRunning = false;
        let completedPomodorosToday = 0;
        let totalMinutesFocused = 0;
        let tasks = [];
        
        // MOTOR DE ÁUDIO WEB AUDIO API
        let audioCtx = null;
        let ambientNoiseNode = null;
        let ambientGainNode = null;
        let isAmbientPlaying = false;
        let currentSoundType = 'brown';

        // REFERÊNCIAS DO DOM
        const timerDisplay = document.getElementById('timerDisplay');
        const statusLabel = document.getElementById('statusLabel');
        const statusDot = document.getElementById('statusDot');
        const progressRing = document.getElementById('progressRing');
        const btnStart = document.getElementById('btnStart');
        const startIcon = document.getElementById('startIcon');
        const startText = document.getElementById('startText');
        const taskList = document.getElementById('taskList');
        const taskCompletedRatio = document.getElementById('taskCompletedRatio');
        const timerCard = document.getElementById('timerCard');
        const circumference = 2 * Math.PI * 42;

        // GERADOR DE SOM SINTETIZADO E SINAIS TÁTICOS
        function playTacticalSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                if (type === 'click') {
                    // Clique mecânico sutil
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.04);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.04);
                } else if (type === 'alarm') {
                    // Alarme tático de finalização de missão
                    const notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.12);
                        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.12 + 0.4);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(audioCtx.currentTime + idx * 0.12);
                        osc.stop(audioCtx.currentTime + idx * 0.12 + 0.4);
                    });
                }
            } catch (e) {
                console.log("Audio Error:", e);
            }

            // Vibração Hática em Dispositivos Móveis (Android/iOS PWA)
            if (config.enableHaptics && window.navigator && window.navigator.vibrate) {
                if (type === 'click') window.navigator.vibrate(20);
                if (type === 'alarm') window.navigator.vibrate([100, 50, 100, 50, 200]);
            }
        }

        // GERADOR DE RUÍDO DE FOCO (Brownian / Rain)
        function toggleAmbientSound() {
            playTacticalSound('click');
            if (isAmbientPlaying) {
                stopAmbientSound();
            } else {
                startAmbientSound();
            }
        }

        function changeSoundType() {
            currentSoundType = document.getElementById('soundTypeSelect').value;
            const soundNames = { brown: 'Ruído Marrom (Foco Profundo)', rain: 'Chuva Suave de Foco' };
            document.getElementById('ambientSoundName').textContent = soundNames[currentSoundType];
            
            if (isAmbientPlaying) {
                stopAmbientSound();
                startAmbientSound();
            }
        }

        function startAmbientSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);

                if (currentSoundType === 'brown') {
                    // Algoritmo de Ruído Marrom (Brown Noise) - frequência grave relaxante
                    let lastOut = 0.0;
                    for (let i = 0; i < bufferSize; i++) {
                        let white = Math.random() * 2 - 1;
                        output[i] = (lastOut + (0.02 * white)) / 1.02;
                        lastOut = output[i];
                        output[i] *= 0.12; // Volume ajustado para conforto
                    }
                } else {
                    // Chuva suave mascarada
                    let b0 = 0, b1 = 0, b2 = 0;
                    for (let i = 0; i < bufferSize; i++) {
                        let white = Math.random() * 2 - 1;
                        b0 = 0.99 * b0 + white * 0.05;
                        b1 = 0.96 * b1 + white * 0.1;
                        output[i] = b0 + b1 + white * 0.1;
                        output[i] *= 0.04;
                    }
                }

                ambientNoiseNode = audioCtx.createBufferSource();
                ambientNoiseNode.buffer = noiseBuffer;
                ambientNoiseNode.loop = true;

                ambientGainNode = audioCtx.createGain();
                ambientGainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);

                ambientNoiseNode.connect(ambientGainNode);
                ambientGainNode.connect(audioCtx.destination);
                ambientNoiseNode.start();

                isAmbientPlaying = true;
                document.getElementById('ambientStateText').textContent = "Pausar";
                document.getElementById('ambientIcon').className = "fa-solid fa-pause text-[10px]";
                document.getElementById('ambientIconBg').className = "w-8 h-8 rounded-lg bg-tactical-amber/20 text-tactical-amber flex items-center justify-center";
                showToast("Sons de Foco Ativados", "fa-headphones");
            } catch (e) {
                console.log(e);
            }
        }

        function stopAmbientSound() {
            if (ambientNoiseNode) {
                ambientNoiseNode.stop();
                ambientNoiseNode = null;
            }
            isAmbientPlaying = false;
            document.getElementById('ambientStateText').textContent = "Ligar";
            document.getElementById('ambientIcon').className = "fa-solid fa-play text-[10px]";
            document.getElementById('ambientIconBg').className = "w-8 h-8 rounded-lg bg-tactical-800 text-slate-400 flex items-center justify-center";
        }

        // CONTROLE DO CRONÔMETRO DE FOCO
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const formatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            timerDisplay.textContent = formatted;
            document.title = `${formatted} - ${getStatusTitle()}`;

            // Atualização do Anel
            const offset = circumference - (timeLeft / totalTime) * circumference;
            progressRing.style.strokeDashoffset = offset;
        }

        function getStatusTitle() {
            if (currentMode === 'focus') return 'Foco Profundo';
            if (currentMode === 'shortBreak') return 'Pausa Curta';
            return 'Recarga Longa';
        }

        function toggleTimer() {
            playTacticalSound('click');
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;

            startIcon.className = "fa-solid fa-pause";
            startText.textContent = "PAUSAR";

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    if (currentMode === 'focus') totalMinutesFocused += 1 / 60;
                    updateDisplay();
                } else {
                    onTimerComplete();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            startIcon.className = "fa-solid fa-play";
            startText.textContent = isRunning ? "PAUSAR" : "CONTINUAR";
        }

        function resetTimer() {
            playTacticalSound('click');
            pauseTimer();
            timeLeft = config[currentMode];
            totalTime = config[currentMode];
            startText.textContent = "INICIAR MISSÃO";
            updateDisplay();
        }

        function onTimerComplete() {
            pauseTimer();
            playTacticalSound('alarm');

            if (currentMode === 'focus') {
                completedPomodorosToday++;
                saveStats();
                showToast("Missão Cumprida! Descanse alguns minutos.", "fa-trophy");
                
                if (completedPomodorosToday % 4 === 0) {
                    switchMode('longBreak');
                } else {
                    switchMode('shortBreak');
                }
            } else {
                showToast("Pausa concluída. Hora de voltar à ação!", "fa-bolt");
                switchMode('focus');
            }
        }

        function skipSession() {
            playTacticalSound('click');
            pauseTimer();
            showToast("Etapa Avançada.", "fa-forward");
            if (currentMode === 'focus') {
                switchMode('shortBreak');
            } else {
                switchMode('focus');
            }
        }

        // ALTERNÂNCIA DE MODOS TÁTICOS
        function switchMode(mode) {
            pauseTimer();
            currentMode = mode;
            timeLeft = config[mode];
            totalTime = config[mode];

            const btnFocus = document.getElementById('modeFocus');
            const btnShort = document.getElementById('modeShort');
            const btnLong = document.getElementById('modeLong');

            // Resetar estilos
            [btnFocus, btnShort, btnLong].forEach(btn => {
                btn.className = "flex-1 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider transition-all duration-300 text-slate-400 hover:text-white flex items-center justify-center gap-1.5";
            });

            if (mode === 'focus') {
                btnFocus.className = "flex-1 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider transition-all duration-300 bg-tactical-amber text-tactical-950 shadow-md flex items-center justify-center gap-1.5";
                statusLabel.textContent = "FOCO TOTAL ATIVO";
                statusDot.className = "w-2 h-2 rounded-full bg-tactical-amber animate-pulse";
                progressRing.className.baseVal = "progress-ring__circle text-tactical-amber";
                btnStart.className = "flex-1 py-4 bg-tactical-amber hover:bg-amber-500 text-tactical-950 font-black rounded-2xl shadow-xl text-base tracking-wider uppercase transition-all active:scale-95 flex items-center justify-center gap-2";
                timerCard.className = "relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center bg-tactical-900/40 rounded-full border border-tactical-700/30 p-2 shadow-2xl transition-all duration-500 glow-amber";
            } else if (mode === 'shortBreak') {
                btnShort.className = "flex-1 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider transition-all duration-300 bg-tactical-emerald text-tactical-950 shadow-md flex items-center justify-center gap-1.5";
                statusLabel.textContent = "PAUSA CURTA DE RECARGA";
                statusDot.className = "w-2 h-2 rounded-full bg-tactical-emerald animate-pulse";
                progressRing.className.baseVal = "progress-ring__circle text-tactical-emerald";
                btnStart.className = "flex-1 py-4 bg-tactical-emerald hover:bg-emerald-500 text-tactical-950 font-black rounded-2xl shadow-xl text-base tracking-wider uppercase transition-all active:scale-95 flex items-center justify-center gap-2";
                timerCard.className = "relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center bg-tactical-900/40 rounded-full border border-tactical-700/30 p-2 shadow-2xl transition-all duration-500 glow-emerald";
            } else {
                btnLong.className = "flex-1 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider transition-all duration-300 bg-tactical-cyan text-tactical-950 shadow-md flex items-center justify-center gap-1.5";
                statusLabel.textContent = "RECARGA LONGA OPERACIONAL";
                statusDot.className = "w-2 h-2 rounded-full bg-tactical-cyan animate-pulse";
                progressRing.className.baseVal = "progress-ring__circle text-tactical-cyan";
                btnStart.className = "flex-1 py-4 bg-tactical-cyan hover:bg-cyan-500 text-tactical-950 font-black rounded-2xl shadow-xl text-base tracking-wider uppercase transition-all active:scale-95 flex items-center justify-center gap-2";
                timerCard.className = "relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center bg-tactical-900/40 rounded-full border border-tactical-700/30 p-2 shadow-2xl transition-all duration-500 glow-cyan";
            }

            updateDisplay();
        }

        // SISTEMA DE TAREFAS / OBJETIVOS TÁTICOS
        function renderTasks() {
            taskList.innerHTML = '';
            const completedCount = tasks.filter(t => t.done).length;
            taskCompletedRatio.textContent = `${completedCount}/${tasks.length}`;

            if (tasks.length === 0) {
                taskList.innerHTML = `<li class="text-[11px] text-slate-500 text-center py-3">Nenhum objetivo definido. Adicione acima para iniciar!</li>`;
                return;
            }

            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = `flex items-center justify-between p-2.5 rounded-xl bg-tactical-950 border border-tactical-800 text-xs transition-all ${task.done ? 'opacity-40' : ''}`;
                
                const priorityBadge = task.priority === 'Alta' ? '🔴' : task.priority === 'Média' ? '🟡' : '🟢';

                li.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden mr-2">
                        <button onclick="toggleTask(${index})" class="w-5 h-5 rounded-md border ${task.done ? 'bg-tactical-amber border-tactical-amber text-tactical-950' : 'border-tactical-700'} flex items-center justify-center transition-all">
                            ${task.done ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
                        </button>
                        <span class="text-[10px]">${priorityBadge}</span>
                        <span class="${task.done ? 'line-through text-slate-500' : 'text-slate-200'} font-medium truncate">${escapeHtml(task.text)}</span>
                    </div>
                    <button onclick="deleteTask(${index})" class="text-slate-600 hover:text-rose-400 p-1 transition-all">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                `;
                taskList.appendChild(li);
            });
        }

        function addTask(e) {
            e.preventDefault();
            playTacticalSound('click');
            const input = document.getElementById('taskInput');
            const priority = document.getElementById('taskPriority').value;
            const text = input.value.trim();
            if (!text) return;

            tasks.push({ text, priority, done: false });
            input.value = '';
            saveTasks();
            renderTasks();
            showToast("Objetivo adicionado com sucesso!", "fa-check");
        }

        function toggleTask(index) {
            playTacticalSound('click');
            tasks[index].done = !tasks[index].done;
            saveTasks();
            renderTasks();
        }

        function deleteTask(index) {
            playTacticalSound('click');
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function saveTasks() {
            localStorage.setItem('tactical_tasks', JSON.stringify(tasks));
        }

        function saveStats() {
            localStorage.setItem('tactical_pomodoros_today', completedPomodorosToday);
            localStorage.setItem('tactical_total_minutes', totalMinutesFocused);
        }

        function loadData() {
            const savedTasks = localStorage.getItem('tactical_tasks');
            if (savedTasks) tasks = JSON.parse(savedTasks);

            const savedPomo = localStorage.getItem('tactical_pomodoros_today');
            if (savedPomo) completedPomodorosToday = parseInt(savedPomo);

            const savedMin = localStorage.getItem('tactical_total_minutes');
            if (savedMin) totalMinutesFocused = parseFloat(savedMin);

            renderTasks();
        }

        // ESTATÍSTICAS E MODAL
        function toggleStatsModal() {
            playTacticalSound('click');
            const modal = document.getElementById('statsModal');
            const box = document.getElementById('statsModalBox');

            document.getElementById('statTodayCount').textContent = completedPomodorosToday;
            document.getElementById('statTotalHours').textContent = (totalMinutesFocused / 60).toFixed(1) + 'h';
            
            const goalPercent = Math.min(100, Math.round((completedPomodorosToday / 4) * 100));
            document.getElementById('statGoalPercent').textContent = `${goalPercent}%`;
            document.getElementById('statGoalBar').style.width = `${goalPercent}%`;

            if (modal.classList.contains('opacity-0')) {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            } else {
                modal.classList.add('opacity-0', 'pointer-events-none');
                box.classList.remove('scale-100');
                box.classList.add('scale-95');
            }
        }

        function openSettings() {
            playTacticalSound('click');
            document.getElementById('inputFocus').value = config.focus / 60;
            document.getElementById('inputShort').value = config.shortBreak / 60;
            document.getElementById('inputLong').value = config.longBreak / 60;
            document.getElementById('inputHaptics').checked = config.enableHaptics;

            const modal = document.getElementById('settingsModal');
            const box = document.getElementById('settingsModalBox');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-95');
            box.classList.add('scale-100');
        }

        function closeSettings() {
            playTacticalSound('click');
            const modal = document.getElementById('settingsModal');
            const box = document.getElementById('settingsModalBox');
            modal.classList.add('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
        }

        function saveSettings() {
            playTacticalSound('click');
            const f = parseInt(document.getElementById('inputFocus').value) || 25;
            const s = parseInt(document.getElementById('inputShort').value) || 5;
            const l = parseInt(document.getElementById('inputLong').value) || 15;
            config.enableHaptics = document.getElementById('inputHaptics').checked;

            config.focus = f * 60;
            config.shortBreak = s * 60;
            config.longBreak = l * 60;

            closeSettings();
            resetTimer();
            showToast("Novos tempos configurados!", "fa-sliders");
        }

        function showToast(message, iconClass = "fa-circle-check") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = message;
            toastIcon.className = `fa-solid ${iconClass} text-tactical-amber text-lg`;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 3000);
        }

        // INICIALIZAÇÃO INICIAL AO CARREGAR
        window.onload = function() {
            progressRing.style.strokeDasharray = `${circumference} ${circumference}`;
            loadData();
            updateDisplay();
        };
    </script>
</body>
</html>
